<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sell your car | MobilityXchange</title>
  <meta name="description" content="List your car on MobilityXchange. We film it, post it, and bring serious buyers to a viewing.">
  <meta name="theme-color" content="#101010">
  <meta name="color-scheme" content="dark light">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preload" href="/fonts/montserrat-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script>try{if(localStorage.getItem("mx-theme")==="light")document.documentElement.dataset.theme="light"}catch(e){}</script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="sell">
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/"><img src="/img/logo-car.png" alt="" width="80" height="20">MobilityXchange</a>
      <nav class="nav" aria-label="Main">
        <a href="/">Cars</a>
        <button class="theme-btn" id="theme" type="button" aria-label="Switch to light mode" title="Switch to light mode">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <h1 class="page-title">Sell your car</h1>
    <p class="meta">Fill this in and we will contact you on WhatsApp. No payment on this site.</p>

    <form class="form" id="sell-form" novalidate>
      <div class="notice" id="form-msg" hidden role="alert"></div>

      <div class="field">
        <label for="name">Full name</label>
        <input id="name" name="name" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="phone">Phone (WhatsApp)</label>
        <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="0712 345 678" required>
      </div>
      <div class="field">
        <label for="reg">Registration number</label>
        <input id="reg" name="reg" autocapitalize="characters" placeholder="KBZ 123X" required>
      </div>
      <div class="row">
        <div class="field">
          <label for="price">Asking price (KES)</label>
          <input id="price" name="price" inputmode="numeric" placeholder="1150000" required>
        </div>
        <div class="field">
          <label for="town">Town</label>
          <select id="town" name="town" required></select>
        </div>
      </div>
      <div class="field">
        <label for="logbook">Logbook (photo or PDF)</label>
        <input id="logbook" name="logbook" type="file" accept="image/jpeg,image/png,image/webp,application/pdf">
        <span class="hint">Max 5 MB. Used only to check ownership.</span>
      </div>
      <div class="field">
        <label for="idcard">Your ID (photo or PDF)</label>
        <input id="idcard" name="idcard" type="file" accept="image/jpeg,image/png,image/webp,application/pdf">
        <span class="hint">Max 5 MB. Stored privately and never shown on listings.</span>
      </div>

      <label class="check">
        <input type="checkbox" name="consent" required>
        <span>I authorize MobilityXchange to market this car on my behalf.</span>
      </label>

      <div class="hp" aria-hidden="true">
        <label>Website <input name="website" tabindex="-1" autocomplete="off"></label>
      </div>

      <button class="btn btn-primary btn-block" type="submit">Submit car</button>
    </form>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; <span id="year"></span> MobilityXchange.</p>
    </div>
  </footer>

  <script src="/config.js"></script>
  <script src="/data.js"></script>
  <script src="/app.js"></script>
</body>
</html>
