<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Car details | MobilityXchange</title>
  <meta name="description" content="Car details and viewing booking on MobilityXchange.">
  <meta name="theme-color" content="#101010">
  <meta name="color-scheme" content="dark light">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preload" href="/fonts/montserrat-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script>try{if(localStorage.getItem("mx-theme")==="light")document.documentElement.dataset.theme="light"}catch(e){}</script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="car">
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/"><img src="/img/logo-car.png" alt="" width="80" height="20">MobilityXchange</a>
      <nav class="nav" aria-label="Main">
        <a href="/">Cars</a>
        <a href="/sell">Sell</a>
        <button class="theme-btn" id="theme" type="button" aria-label="Switch to light mode" title="Switch to light mode">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div class="notice" id="demo-banner" hidden>Demo mode: this is a sample listing.</div>
    <div class="car" id="car-root" aria-live="polite">
      <p class="meta">Loading...</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; <span id="year"></span> MobilityXchange.</p>
    </div>
  </footer>

  <script src="/config.js"></script>
  <script src="/data.js"></script>
  <script src="/app.js"></script>
</body>
</html>
